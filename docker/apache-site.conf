<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    <Directory /var/www/html/autotrackplus>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    # Omit query strings and Referer to keep password tokens out of access logs.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" safe_access
    CustomLog /proc/self/fd/1 safe_access
</VirtualHost>
